name: Build & publish app image

# Rebuilds the multi-arch Streamlit app image and pushes it to GHCR so lab
# members can `docker pull` (via run_app.sh) the latest version.
#
# Triggers:
#   - push to main that changes anything under intactness/ (code, env file,
#     Dockerfile) or this workflow itself
#   - the manual "Run workflow" button (workflow_dispatch)
#
# The image is built on GitHub's runners, which have unrestricted network
# access to conda.anaconda.org, so the corporate firewall does not apply.
on:
  push:
    branches: [main]
    paths:
      - 'intactness/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

# Cancel an in-progress build if a newer commit is pushed.
concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/intactness-app
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: img
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: intactness/Dockerfile.app
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ steps.img.outputs.name }}\`"
            echo ""
            echo "- Platforms: \`${PLATFORMS}\`"
            echo "- Tags: \`latest\`, \`${{ github.sha }}\`"
            echo ""
            echo "Lab members update with: \`docker pull ${{ steps.img.outputs.name }}:latest\` (or just run \`run_app.sh\`)."
          } >> "$GITHUB_STEP_SUMMARY"
